<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101319">
  <title>Jaankeza Utils</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.47.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/app.css">
  <!-- Classic (blocking) script: applies the saved accent before first paint, then boots on DOMContentLoaded. -->
  <script src="/app.js"></script>
</head>
<body>
  <div id="loadbar" aria-hidden="true"></div>
  <div id="app" aria-busy="true"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <noscript><p class="noscript">Za nadzornu ploču uključi JavaScript.</p></noscript>
</body>
</html>
